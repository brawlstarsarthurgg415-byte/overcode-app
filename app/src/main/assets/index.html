<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Overcode</title>
<style>
:root{--bg:#1f1e1d;--pn:#262624;--bd:#3a3936;--tx:#ece9e1;--mu:#a09d94;--ac:#d97757;--bt:#33322f}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--bd)}
#top b{font:600 19px Georgia,serif}#top span{flex:1;font-size:12px;color:var(--mu);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
button,input,select,textarea{font:inherit;color:var(--tx)}
.bt{background:var(--bt);border:1px solid var(--bd);border-radius:10px;padding:8px 12px}
#chat{flex:1;overflow:auto;padding:16px 14px;display:flex;flex-direction:column;gap:14px}
.m{line-height:1.55;white-space:pre-wrap;word-wrap:break-word;animation:ent .3s both}
@keyframes ent{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.u{align-self:flex-end;background:var(--bt);padding:10px 14px;border-radius:16px;max-width:88%}
.a{font-family:Georgia,serif;font-size:17px}
.a pre{background:#161514;border:1px solid var(--bd);border-radius:10px;padding:10px;overflow:auto;font:13px monospace;white-space:pre}
.a code{background:#161514;border-radius:5px;padding:1px 5px;font:14px monospace}
#vb{display:none;align-items:center;gap:8px;color:var(--mu);font-size:14px;padding:0 16px 6px}
#vb i{width:8px;height:8px;border-radius:50%;background:var(--ac);animation:pisca 1s infinite}
@keyframes pisca{50%{opacity:.15}}
#bar{padding:8px 12px calc(12px + env(safe-area-inset-bottom))}
#at{font-size:12px;color:var(--mu);padding:0 8px 4px}
#box{display:flex;gap:8px;align-items:flex-end;background:var(--pn);border:1px solid var(--bd);border-radius:22px;padding:8px}
#box textarea{flex:1;background:none;border:0;outline:0;resize:none;max-height:140px;padding:8px 6px}
.rd{width:40px;height:40px;border-radius:50%;border:0;background:var(--bt);font-size:18px}.rd.p{background:var(--ac);color:#fff}
.md{position:fixed;left:0;right:0;top:0;bottom:0;background:#000b;display:none;align-items:flex-end;z-index:9}.md.on{display:flex}
.cx{background:var(--pn);border-radius:20px 20px 0 0;padding:16px;width:100%;max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:8px}
.cx input,.cx select,.cx textarea{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%}
.cx label{font-size:13px;color:var(--mu)}
.ch{display:inline-block;margin:3px;padding:6px 10px;border-radius:12px;background:var(--bt);font-size:12px}
</style></head><body>
<div id="top"><b>Overcode</b><span id="info"></span><button class="bt" onclick="novo()">Nova</button><button class="bt" onclick="cfgOpen()">⚙</button></div>
<div id="chat"></div>
<div id="vb"><i></i><span></span></div>
<div id="bar"><div id="at"></div>
<div id="box"><button class="rd" onclick="f.click()">📎</button><textarea id="t" rows="1" placeholder="Fale com o Overcode..."></textarea><button class="rd" onclick="mic()">🎤</button><button class="rd p" id="s" onclick="busy?stop():send()">↑</button></div></div>
<input type="file" id="f" multiple hidden>
<div class="md" id="cf" onclick="if(event.target===this)cfgClose()"><div class="cx">
<b>Configurações</b>
<label>IA</label><select id="p" onchange="cfgShow()"><option value="gemini">Gemini (nuvem, chave grátis)</option><option value="openai">Outra nuvem (Groq, OpenRouter, OpenAI...)</option><option value="local">Local (llama-server do Termux)</option></select>
<div id="g"><label>Chave da API do Gemini</label><input id="gk" type="password"><label>Modelo</label><input id="gm"><button class="bt" onclick="modelos()">Listar modelos</button><div id="gl"></div></div>
<div id="o"><label>Endereço da API (termina em /v1)</label><input id="ourl"><label>Chave</label><input id="okey" type="password"><label>Modelo</label><input id="omod"></div>
<div id="l"><label>Endereço do servidor local</label><input id="lurl"><label>Modelo (opcional)</label><input id="lmod"></div>
<label>Instruções da IA</label><textarea id="sys" rows="3"></textarea>
<label>Cor de destaque</label><input id="cor" type="color">
<label><input type="checkbox" id="ouv" style="width:auto"> Ao apertar o botão lateral, já abrir ouvindo (voz)</label>
<button class="bt" onclick="cfgSave()">Salvar</button></div></div>
<script>
const $=id=>document.getElementById(id);
let C={prov:'gemini',gk:'',gm:'gemini-2.5-flash',ourl:'https://api.groq.com/openai/v1',okey:'',omod:'llama-3.3-70b-versatile',lurl:'http://127.0.0.1:8081',lmod:'',cor:'#d97757',ouv:true,
 sys:'Você é o Overcode, um assistente prestativo. Responda em português, de forma clara e direta.'};
try{Object.assign(C,JSON.parse(Android.getCfg()||'{}'))}catch(e){}
let H=[],busy=false,rid=0,cbs={},att=[],cur=0,autoSend=false;
const VB=['Matutando','Pensando','Diagnosticando','Apreciando','Ponderando','Cogitando','Analisando','Refletindo','Ruminando','Maquinando'];let vi=0;
function tema(){document.documentElement.style.setProperty('--ac',C.cor);$('info').textContent=({gemini:'Gemini · '+C.gm,openai:C.omod,local:'Local'})[C.prov]}
tema();
function startVb(){const v=$('vb');v.style.display='flex';const f=()=>{v.querySelector('span').textContent=VB[Math.floor(Math.random()*VB.length)]+'…'};f();vi=setInterval(f,2200)}
function stopVb(){clearInterval(vi);$('vb').style.display='none'}
function md(t){t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
 t=t.replace(/```[\w-]*\n?([\s\S]*?)```/g,'<pre>$1</pre>');
 return t.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')}
function bub(c,t){const d=document.createElement('div');d.className='m '+c;if(c==='a')d.innerHTML=md(t);else d.textContent=t;$('chat').appendChild(d);scr();return d}
function scr(){$('chat').scrollTop=1e9}
window.onLine=(id,l)=>{if(cbs[id])cbs[id].line(l)};
window.onEnd=(id,code)=>{if(cbs[id]){cbs[id].end(code);delete cbs[id]}};
window.onVoice=t=>{if(t){$('t').value+=($('t').value?' ':'')+t;if(autoSend){autoSend=false;send();return}}autoSend=false;$('t').focus()};
window.onAssist=()=>{if(C.ouv){autoSend=true;Android.mic()}};
function mic(){Android.mic()}
function req(method,url,headers,body,line,end){const id=++rid;cbs[id]={line:line,end:end};Android.http(id,method,url,JSON.stringify(headers),body||'');return id}
function build(){
 if(C.prov==='gemini'){
  const ct=H.map(m=>({role:m.role==='user'?'user':'model',parts:[{text:m.text}].concat((m.imgs||[]).map(i=>({inline_data:{mime_type:i.mime,data:i.data}})))}));
  return{url:'https://generativelanguage.googleapis.com/v1beta/models/'+C.gm+':streamGenerateContent?alt=sse&key='+encodeURIComponent(C.gk),
   headers:{'Content-Type':'application/json'},body:JSON.stringify({system_instruction:{parts:[{text:C.sys}]},contents:ct})}}
 const lo=C.prov==='local',base=(lo?C.lurl+'/v1':C.ourl).replace(/\/$/,''),key=lo?'':C.okey;
 return{url:base+'/chat/completions',headers:Object.assign({'Content-Type':'application/json'},key?{Authorization:'Bearer '+key}:{}),
  body:JSON.stringify({model:lo?(C.lmod||'local'):C.omod,stream:true,messages:[{role:'system',content:C.sys}].concat(H.map(m=>({role:m.role,content:m.text})))})}}
function delta(l){if(l.indexOf('data:')!==0)return'';const d=l.slice(5).trim();if(!d||d==='[DONE]')return'';
 try{const j=JSON.parse(d);
  if(C.prov==='gemini')return((j.candidates&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||'').join('');
  return(j.choices&&j.choices[0].delta&&j.choices[0].delta.content)||''}catch(e){return''}}
function ui(on){busy=on;$('s').textContent=on?'■':'↑';if(on)startVb();else stopVb()}
function send(){const t=$('t').value.trim();if((!t&&!att.length)||busy)return;
 if((C.prov==='gemini'&&!C.gk)||(C.prov==='openai'&&!C.okey)){cfgOpen();return}
 let text=t;att.filter(a=>a.txt!=null).forEach(a=>{text+='\n\n[arquivo '+a.name+']\n'+a.txt});
 H.push({role:'user',text:text,imgs:att.filter(a=>a.data).map(a=>({mime:a.mime,data:a.data}))});
 bub('u',t+(att.length?'\n📎 '+att.map(a=>a.name).join(', '):''));att=[];$('at').textContent='';$('t').value='';
 const b=bub('a',''),r=build();let out='',raw='';ui(true);
 cur=req('POST',r.url,r.headers,r.body,l=>{raw+=l+'\n';const d=delta(l);if(d){out+=d;b.innerHTML=md(out);scr()}},code=>{
  ui(false);
  if(code>=400||code===-1){H.pop();b.textContent=(code===-1?'Falha de conexão: ':'Erro '+code+': ')+raw.slice(0,500)}
  else{if(!out)b.textContent='(sem resposta; confira a chave, o modelo ou se o servidor local está ligado)';H.push({role:'assistant',text:out||'(sem resposta)'})}})}
function stop(){Android.cancel(cur)}
function novo(){H=[];$('chat').innerHTML=''}
$('f').onchange=async e=>{for(const f of e.target.files){const a={name:f.name,mime:f.type};
 if(f.type.indexOf('image/')===0){a.data=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)})}
 else a.txt=(await f.text()).slice(0,20000);
 att.push(a)}e.target.value='';$('at').textContent='📎 '+att.map(a=>a.name).join(', ')};
function cfgShow(){const p=$('p').value;$('g').style.display=p==='gemini'?'block':'none';$('o').style.display=p==='openai'?'block':'none';$('l').style.display=p==='local'?'block':'none'}
function cfgOpen(){$('p').value=C.prov;['gk','gm','ourl','okey','omod','lurl','lmod','sys','cor'].forEach(k=>{$(k).value=C[k]});$('ouv').checked=C.ouv;cfgShow();$('cf').classList.add('on')}
function cfgClose(){$('cf').classList.remove('on')}
function cfgSave(){C.prov=$('p').value;['gk','gm','ourl','okey','omod','lurl','lmod','sys','cor'].forEach(k=>{C[k]=$(k).value.trim()});C.ouv=$('ouv').checked;
 Android.setCfg(JSON.stringify(C));tema();cfgClose()}
function modelos(){const k=$('gk').value.trim();if(!k){$('gl').textContent='Cole a chave primeiro.';return}
 let raw='';$('gl').textContent='Buscando...';
 req('GET','https://generativelanguage.googleapis.com/v1beta/models?pageSize=100&key='+encodeURIComponent(k),{},'',l=>{raw+=l},code=>{
  try{const j=JSON.parse(raw);$('gl').innerHTML='';(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).indexOf('generateContent')>=0).forEach(m=>{
   const c=document.createElement('span');c.className='ch';c.textContent=m.name.replace('models/','');c.onclick=()=>{$('gm').value=c.textContent};$('gl').appendChild(c)})}
  catch(e){$('gl').textContent='Erro '+code+': '+raw.slice(0,200)}})}
</script></body></html>
